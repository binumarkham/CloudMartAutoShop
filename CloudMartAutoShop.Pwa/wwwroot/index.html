<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>CloudMart Auto Shop Manager</title>

    <base href="/autoshop/" />

    <link rel="stylesheet"
          href="lib/bootstrap/dist/css/bootstrap.min.css" />

    <link rel="stylesheet"
          href="css/app.css" />

    <link rel="icon"
          type="image/png"
          href="favicon.png" />

    <link href="CloudMartAutoShop.Pwa.styles.css"
          rel="stylesheet" />
</head>

<body>

    <div id="app">
        <div class="app-loading">
            <div class="app-loading-mark">CM</div>

            <div class="app-loading-text">
                <strong>CloudMart</strong>
                <span>Auto Shop Manager</span>
            </div>

            <div class="app-loading-status">
                Loading...
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">×</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

</body>

</html>
