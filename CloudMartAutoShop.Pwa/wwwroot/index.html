<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>CloudMart Auto Shop Manager</title>

    <base href="/autoshop/" />

    <link rel="stylesheet"
          href="lib/bootstrap/dist/css/bootstrap.min.css" />

    <link rel="stylesheet"
          href="css/app.css" />

    <link rel="icon"
          type="image/png"
          href="favicon.png" />

    <link href="CloudMartAutoShop.Pwa.styles.css"
          rel="stylesheet" />
</head>

<body>

    <div id="app">
        <div class="app-loading">
            <div class="app-loading-mark">CM</div>

            <div class="app-loading-text">
                <strong>CloudMart</strong>
                <span>Auto Shop Manager</span>
            </div>

            <div class="app-loading-status">
                Loading...
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">×</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

<script>
    window.cloudMartAutoShopPwa = {
        registration: null,
        updateIntervalId: null,
        visibilityHandler: null,
        dotNetReference: null,

        setDotNetReference: function (dotNetReference) {
            this.dotNetReference = dotNetReference;
        },

        initialize: async function () {
            if (!("serviceWorker" in navigator)) {
                return;
            }

            try {
                const registration =
                    await navigator.serviceWorker.register(
                        "service-worker.js"
                    );

                this.registration = registration;

                // Check immediately when Auto Shop starts.
                await registration.update();

                // Check every 5 minutes while the app remains open.
                if (!this.updateIntervalId) {
                    this.updateIntervalId =
                        setInterval(async () => {
                            try {
                                await this.registration.update();

                                if (this.dotNetReference) {
                                    await this.dotNetReference.invokeMethodAsync(
                                        "CheckForUpdateFromBrowser"
                                    );
                                }
                            }
                            catch (error) {
                                console.log(
                                    "Auto Shop service worker update check failed.",
                                    error
                                );
                            }
                        }, 5 * 60 * 1000);
                }

                // Check whenever the user returns to the app.
                if (!this.visibilityHandler) {
                    this.visibilityHandler =
                        async () => {
                            if (
                                document.visibilityState !== "visible" ||
                                !this.registration
                            ) {
                                return;
                            }

                            try {
                                await this.registration.update();

                                if (this.dotNetReference) {
                                    await this.dotNetReference.invokeMethodAsync(
                                        "CheckForUpdateFromBrowser"
                                    );
                                }
                            }
                            catch (error) {
                                console.log(
                                    "Auto Shop resume update check failed.",
                                    error
                                );
                            }
                        };

                    document.addEventListener(
                        "visibilitychange",
                        this.visibilityHandler
                    );
                }
            }
            catch (error) {
                console.log(
                    "Auto Shop service worker registration failed.",
                    error
                );
            }
        },

        updateNow: function () {
            if (
                this.registration &&
                this.registration.waiting
            ) {
                this.registration.waiting.postMessage({
                    type: "SKIP_WAITING"
                });

                return true;
            }

            return false;
        }
    };

    navigator.serviceWorker.addEventListener(
        "controllerchange",
        () => {
            window.location.reload();
        }
    );

    window.cloudMartAutoShopForceUpdate = function () {
        const activatedWorker =
            window.cloudMartAutoShopPwa.updateNow();

        if (activatedWorker) {
            return;
        }

        // Fallback when version.json changed but
        // no service worker is currently waiting.
        const url =
            new URL(window.location.href);

        url.searchParams.set(
            "update",
            Date.now().toString()
        );

        window.location.replace(
            url.toString()
        );
    };

    window.cloudMartAutoShopPwa.initialize();
</script>
</body>

</html>
